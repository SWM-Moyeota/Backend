name: 빌드 테스트

on:
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  # setup-gradle 은 기본 브랜치(develop)에서 돌 때만 캐시를 저장한다 - PR 에서만 돌면 캐시가 영영 안 생겨 매번 의존성을 전부 내려받는다
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR 에 다시 push 하면 앞선 실행은 취소한다. develop 실행은 캐시를 저장해야 하므로 취소하지 않는다
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: moyeota
          POSTGRES_USER: moyeota
          POSTGRES_PASSWORD: moyeota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moyeota"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5 

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7