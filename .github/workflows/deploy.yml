name: Deploy to EC2

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: moyeota-deploy-bucket
  CD_APP: moyeota
  CD_GROUP: moyeota-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -x test

      - name: Package
        run: |
          mkdir -p deploy
          cp build/libs/moyeota-0.0.1-SNAPSHOT.jar deploy/app.jar
          cp appspec.yml deploy/
          cp -r scripts deploy/
          chmod +x deploy/scripts/*.sh
          cd deploy && zip -r ../moyeota-${{ github.sha }}.zip .

      - name: Debug OIDC token
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss, aud, sub}'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 cp moyeota-${{ github.sha }}.zip s3://$S3_BUCKET/

      - name: Deploy
        run: |
          DEPLOY_ID=$(aws deploy create-deployment \
            --application-name $CD_APP \
            --deployment-group-name $CD_GROUP \
            --s3-location bucket=$S3_BUCKET,key=moyeota-${{ github.sha }}.zip,bundleType=zip \
            --query deploymentId --output text)
          echo "Deployment: $DEPLOY_ID"
          aws deploy wait deployment-successful --deployment-id $DEPLOY_ID
