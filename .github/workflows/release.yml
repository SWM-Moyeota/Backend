name: Create Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  id-token: write

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        uses: ./.github/actions/calculate-version

  check-source-changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          filters: |
            src:
              - 'src/**'
              - 'build.gradle.kts'
              - 'buildSrc/**'

  build-and-deploy:
    needs: [ calculate-version ]
    runs-on: ubuntu-latest

    steps:
      - name: Repository 접근
        uses: actions/checkout@v4

      - name: JDK 25 셋팅
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 애플리케이션 JAR 빌드
        run: |
          ./gradlew bootJar --no-daemon --build-cache
          BOOT_JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' | head -n 1)
          test -n "$BOOT_JAR"
          cp "$BOOT_JAR" build/libs/app.jar

  release:
    needs: [ calculate-version, build-and-deploy ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        run: gh release create "v${{ needs.calculate-version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 이후 ecr, cd 배포해야함