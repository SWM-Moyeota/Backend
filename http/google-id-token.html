<!DOCTYPE html>
<!--
  구글 ID 토큰 발급용 테스트 페이지 (개발 전용, 서비스와 무관)

  네이티브 앱이 구글 SDK로 받는 것과 같은 형태의 ID 토큰을 브라우저에서 받아온다.
  여기서 나온 토큰을 http/http-client.private.env.json 의 googleIdToken 에 붙여넣고
  http/auth.http 의 1번 요청을 실행하면 앱 로그인 API를 그대로 테스트할 수 있다.

  사용법
    1. 이 폴더에서 정적 서버를 띄운다:  python -m http.server 5500
    2. Google Cloud Console > 사용자 인증 정보 > 아래 클라이언트 ID >
       "승인된 JavaScript 원본"에  http://localhost:5500  을 추가한다. (반영에 몇 분 걸릴 수 있음)
    3. http://localhost:5500/google-id-token.html 접속 후 로그인
    4. 화면에 뜬 토큰을 복사

  주의: ID 토큰의 유효시간은 1시간이다. 만료되면 다시 받아야 한다.
       file:// 로 열면 동작하지 않는다. 구글이 origin 을 검사하기 때문이다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>구글 ID 토큰 발급 (개발용)</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    p { color: #555; line-height: 1.6; }
    #token { width: 100%; height: 220px; margin-top: 16px; font-family: ui-monospace, monospace;
             font-size: 12px; word-break: break-all; }
    #claims { background: #f5f5f5; padding: 12px; border-radius: 6px; font-size: 13px;
              white-space: pre-wrap; margin-top: 12px; }
    button { margin-top: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>구글 ID 토큰 발급 (개발용)</h1>
  <p>
    로그인하면 아래에 ID 토큰이 나온다. 복사해서
    <code>http/http-client.private.env.json</code> 의 <code>googleIdToken</code> 에 붙여넣고
    <code>http/auth.http</code> 의 1번 요청을 실행하면 된다.
  </p>

  <!-- application.properties 의 google.allowed-audiences 와 같은 값이어야 한다.
       다르면 서버가 401 invalid google id token 으로 막는다. -->
  <div id="g_id_onload"
       data-client_id="950947204009-060imloelranqsuk4cil01qiorpvdp4h.apps.googleusercontent.com"
       data-callback="onSignIn"
       data-auto_prompt="false"></div>
  <div class="g_id_signin" data-type="standard" data-size="large" data-text="signin_with"></div>

  <textarea id="token" readonly placeholder="로그인하면 여기에 ID 토큰이 표시된다"></textarea>
  <button id="copy" hidden>복사</button>

  <!-- 서버가 검증하는 값들을 눈으로 확인할 수 있게 페이로드를 풀어서 보여준다.
       aud 가 allowed-audiences 와 일치하는지가 핵심이다. -->
  <div id="claims" hidden></div>

  <script>
    function onSignIn(response) {
      const idToken = response.credential;
      document.getElementById('token').value = idToken;
      document.getElementById('copy').hidden = false;

      const payload = JSON.parse(
        atob(idToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))
      );
      document.getElementById('claims').hidden = false;
      document.getElementById('claims').textContent =
        'aud (= allowed-audiences 와 같아야 함)\n  ' + payload.aud +
        '\n\nsub (서버의 username 은 "google " + sub)\n  ' + payload.sub +
        '\n\nemail\n  ' + payload.email +
        '\n\nname\n  ' + payload.name +
        '\n\n만료\n  ' + new Date(payload.exp * 1000).toLocaleString();
    }

    document.getElementById('copy').addEventListener('click', () => {
      navigator.clipboard.writeText(document.getElementById('token').value);
    });
  </script>
</body>
</html>
