services:
  redis:
    image: redis:7-alpine
    container_name: moyeota-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgis/postgis:16-3.5-alpine
    platform: linux/amd64   # postgis 공식 이미지는 amd64 만 제공 - Apple Silicon 에선 에뮬레이션으로 돈다
    container_name: moyeota-postgres
    environment:
      POSTGRES_DB: moyeota
      POSTGRES_USER: moyeota
      POSTGRES_PASSWORD: moyeota
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U moyeota" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
