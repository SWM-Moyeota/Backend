global:
  scrape_interval: 5s            # 스크래핑 주기 시간
  scrape_timeout: 4s             # 스크랩할때 응답을 얼마나 기다릴지
  evaluation_interval: 5s        # 평가 주기 시간
  external_labels:
    env: loadtest

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: app
    metrics_path: /prometheus
    static_configs:
      - targets: ['172.16.1.30:9091']
        labels: { service: moyeota-api, instance_name: prod-api-1 }

  - job_name: node
    static_configs:
      - targets: ['172.16.1.30:9100']
        labels: { role: target, instance_name: prod-api-1 }
      - targets: ['node-exporter:9100']
        labels: { role: loadgen, instance_name: k6-1 }

  - job_name: redis
    static_configs:
      - targets: ['172.16.1.30:9121']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']