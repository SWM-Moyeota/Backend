global:
  scrape_interval: 5s            # 스크래핑 주기 시간
  scrape_timeout: 4s             # 스크랩할때 응답을 얼마나 기다릴지
  evaluation_interval: 5s        # 평가 주기 시간
  external_labels:
    env: loadtest

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # dev 서버 두 대(내부 ALB moyeota-dev-alb 뒤)와 prod 서버 한 대. Grafana 에서는 env 로 환경을, instance_name 으로 서버를 갈라 본다
  # 부하 테스트 규칙(rules/)은 env="dev" 만 본다 - prod 트래픽이 테스트 지표에 섞이지 않게
  - job_name: app
    metrics_path: /prometheus
    static_configs:
      - targets: ['172.16.1.30:9091']
        labels: { env: dev, service: moyeota-api, instance_name: dev-api-a }
      - targets: ['172.16.1.46:9091']
        labels: { env: dev, service: moyeota-api, instance_name: dev-api-c }
      - targets: ['172.16.1.25:9091']
        labels: { env: prod, service: moyeota-api, instance_name: prod-api-a }

  - job_name: node
    static_configs:
      - targets: ['172.16.1.30:9100']
        labels: { env: dev, role: target, instance_name: dev-api-a }
      - targets: ['172.16.1.46:9100']
        labels: { env: dev, role: target, instance_name: dev-api-c }
      - targets: ['172.16.1.25:9100']
        labels: { env: prod, role: target, instance_name: prod-api-a }
      - targets: ['172.16.1.21:9100']
        labels: { env: dev, role: loadgen, instance_name: k6-1 }

  # exporter 는 ElastiCache 를 본다 - 같은 환경의 서버는 같은 Redis 라 환경마다 한 대만 긁는다
  - job_name: redis
    static_configs:
      - targets: ['172.16.1.30:9121']
        labels: { env: dev }
      - targets: ['172.16.1.25:9121']
        labels: { env: prod }

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']   # dev RDS. prod RDS 는 아직 긁지 않는다
        labels: { env: dev }

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']