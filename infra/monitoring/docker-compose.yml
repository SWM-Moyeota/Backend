services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver      # /api/v1/write 엔드포인트를 공개
      - --storage.tsdb.retention.time=30d       # 실행 이력 보존
      - --web.enable-lifecycle                  # /-/reload 엔드포인트 공개 규칙이 바뀌는 경우 재설정
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prom-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:admin}
      - GF_SERVER_ROOT_URL=https://grafana.moyeota.p-e.kr
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, tempo]
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    profiles: ["db"]
    environment:
      - DATA_SOURCE_URI=${PG_EXPORTER_URI:-}
      - DATA_SOURCE_USER=${PG_EXPORTER_USER:-}
      - DATA_SOURCE_PASS=${PG_EXPORTER_PASS:-}
    command: ["--collector.stat_statements"]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    ports: [ "172.16.1.21:3100:3100" ]      # ec2가 push할 수 있도록 구성
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.0
    command: -target=all -config.file=/etc/tempo.yaml
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports: [ "172.16.1.21:4318:4318" ]       # 운영 EC2의 Alloy가 push
    restart: unless-stopped

volumes:
  prom-data: {}
  grafana-data: {}
  loki-data: {}
  tempo-data: {}
