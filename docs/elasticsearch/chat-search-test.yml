name: 채팅 검색 통합 테스트

on:
  pull_request:
    paths:
      - 'src/main/java/team/codingforest/moyeota/chat/**'
      - 'src/main/resources/db/migration/**'
      - 'src/main/resources/elasticsearch/**'
      - 'src/test/java/team/codingforest/moyeota/chat/**'
      - 'build.gradle'
      - '.github/workflows/chat-search-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: search_test
          POSTGRES_USER: search_test
          POSTGRES_PASSWORD: search_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U search_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 19200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 5s --health-timeout 5s --health-retries 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew searchIntegrationTest --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chat-search-test-report
          path: build/reports/tests/searchIntegrationTest
