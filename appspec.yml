version: 0.0
os: linux
files:
  - source: app.jar
    destination: /opt/moyeota
file_exists_behavior: OVERWRITE
permissions:
  - object: /opt/moyeota/app.jar
    owner: root
    group: root
    mode: 644
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 120
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/validate.sh
      timeout: 180
      runas: root