# 테스트는 도커 없이 인메모리 H2로 실행된다.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# 테스트에서 실제 구글 OAuth 설정이 필요 없도록 더미 값 사용
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email

# 테스트용 더미 서명 키. 실제 키를 여기 적으면 저장소에 그대로 올라간다.
# HS256이라 32바이트 이상이어야 해서 길이만 맞춘 아무 값이다.
spring.jwt.secret=test-only-jwt-secret-do-not-use-in-production-0123456789

# 테스트 리소스의 application.properties는 main 쪽 파일을 "덮어쓰는" 게 아니라 "대신하는" 것이라
# main에만 있는 값은 여기에도 따로 적어줘야 한다. 없으면 빈 생성 단계에서 컨텍스트가 뜨지 않는다.
app.frontend-origin=http://localhost:3000
app.oauth2.redirect-uri=${app.frontend-origin}/oauth2/redirect
