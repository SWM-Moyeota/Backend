spring:
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}/${DATABASE_NAME:moyeota}?sslmode=require
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway 가 만든다. 엔티티와 어긋나면 기동 실패 - 그게 목적
  flyway:
    enabled: true
    baseline-on-migrate: true   # 이미 테이블이 있는 기존 DB: V1 을 적용된 것으로 기록하고 V2 부터 실행
    baseline-version: 1
  modulith:
    events:
      # 기본(false)과 다르다 - 재시작 때 미완료 이벤트를 전부 다시 발행한다.
      # IncompleteEventResubmitter 가 같은 일을 큐 상태를 보며 하므로 false 로 맞출지 따로 정해야 한다(미완료가 많으면 기동이 길어져 배포 검증 시간을 넘긴다)
      republish-outstanding-events-on-restart: true

kakao:
  api:
    key: ${KAKAO_API_KEY}

chat:
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}

management:
  server:
    port: 9091   # 지표·헬스는 앱 포트(8080)와 분리 - 외부에 열지 않는다

moyeota:
  taxi:
    enabled: ${TAXI_ENABLED:false}
  party:
    fingerprint-secret: ${PARTY_FINGERPRINT_SECRET}

# 로그에 추적 ID 를 찍는다. OpenTelemetry 에이전트가 요청마다 trace_id·span_id 를 로그 컨텍스트(MDC)에 넣어 준다.
# Grafana 에서 로그 줄의 trace_id 를 누르면 그 요청의 추적(Tempo)으로 넘어간다 - Loki 데이터 소스의 derivedFields 가 이 형식을 읽는다.
# 에이전트는 운영에만 붙으므로 prod 에만 둔다(로컬에 두면 빈 값이 매 줄에 찍힌다).
logging:
  pattern:
    correlation: "[trace_id=%X{trace_id:-} span_id=%X{span_id:-}] "
