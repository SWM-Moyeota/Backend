# 로컬 Postgres(docker compose) 프로필 - 배포와 같은 조건(Flyway + validate)으로 앱을 띄울 때
#   docker compose up -d && ./gradlew bootRun --args='--spring.profiles.active=dev'
# 시크릿(kakao/naver/jwt...)은 application-local.yaml 에서 그대로 import 된다
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/moyeota
    driver-class-name: org.postgresql.Driver
    username: moyeota
    password: moyeota
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway 가 만든다. 엔티티와 어긋나면 기동 실패 - 그게 목적
    open-in-view: false
  flyway:
    enabled: true
