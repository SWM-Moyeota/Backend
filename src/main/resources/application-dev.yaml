# dev 프로필 - 로컬 Postgres(docker compose)로 배포와 같은 조건(Flyway + validate)에서 앱을 띄운다
#   docker compose up -d && ./gradlew bootRun --args='--spring.profiles.active=dev'
# application.yaml 과 다른 값만 둔다. 시크릿(kakao/naver/jwt...)은 application-local.yaml 에서 그대로 import 된다
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/moyeota
    driver-class-name: org.postgresql.Driver
    username: moyeota
    password: moyeota
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway 가 만든다. 엔티티와 어긋나면 기동 실패 - 그게 목적
  flyway:
    enabled: true
