# Google OAuth2
# client-id는 로그인 과정에서 브라우저에도 노출되는 공개 값이라 저장소에 두어도 된다.
# client-secret은 아니다. 아래 application-local.properties 에 둔다.
spring.security.oauth2.client.registration.google.client-id=950947204009-060imloelranqsuk4cil01qiorpvdp4h.apps.googleusercontent.com
spring.security.oauth2.client.registration.google.scope=profile,email

# 비밀값(구글 client-secret, JWT secret)은 이 파일에 적지 않는다.
# 저장소에 올라가는 순간 GitHub Push Protection이 푸시를 거부하고,
# 무엇보다 키가 그대로 새어나간다.
# 각자 로컬에 application-local.properties 를 만들어 넣는다(.gitignore에 등록돼 있다).
# optional: 이라 파일이 없어도 앱은 뜬다. 다만 그 값을 쓰는 기능이 동작하지 않는다.
spring.config.import=optional:classpath:application-local.properties

# Security 디버깅 로그
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web.client.RestTemplate=DEBUG

# DataSource (PostgreSQL - docker compose up -d 로 실행)
# 도커 없이 띄우고 싶으면 h2 프로필로 실행: --spring.profiles.active=h2
spring.datasource.url=jdbc:postgresql://localhost:5433/moyeota
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=moyeota
spring.datasource.password=moyeota1234

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# 요청 전체가 EntityManager 하나를 공유하지 않게 한다.
# 저장이 제약 위반으로 실패한 뒤에도 같은 요청에서 다시 조회할 수 있어야 하므로 꺼둔다.
spring.jpa.open-in-view=false

# 디버깅용 로그 파일 (원인 파악 후 삭제 가능)
logging.file.name=logs/app.log

# 에러 응답에 사유를 함께 담는다.
# 기본값(never)이면 400/409가 나도 본문에 error/status/path만 있고 "무엇이 잘못됐는지"가 빠져서
# 프론트가 "loginId must be 4~20 characters" 같은 메시지를 화면에 띄울 수 없다.
server.error.include-message=always

# 프론트엔드 주소. CORS 허용 오리진으로 쓴다.
app.frontend-origin=http://localhost:3000

# 구글 로그인이 끝난 뒤 토큰을 들려 보낼 프론트 주소.
# CustomSuccessHandler가 여기에 #accessToken=...&refreshToken=... 을 붙여 리다이렉트한다.
app.oauth2.redirect-uri=${app.frontend-origin}/oauth2/redirect
