spring:
  application:
    name: moyeota
  config:
    import: optional:classpath:application-local.yaml   # 로컬 시크릿 (git 미추적, 없으면 무시됨)
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379

kakao:
  api:
    key: ${KAKAO_API_KEY:}

naver:
  api:
    key-id: ${NAVER_API_KEY_ID:}
    key: ${NAVER_API_KEY:}

chat:
  websocket:
    allowed-origins: http://localhost:*

fcm:
  service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}

# user 모듈 JWT 설정. secret 은 base64, 로컬 기본값은 개발용이라 운영은 JWT_SECRET 환경변수 필수
jwt:
  secret: ${JWT_SECRET:deXiPUTSbvL2Qg673qn22K4S6fjf6VSBMLfW54E16DrUPty9aapfs/PGqoO+NdP9}
  access-token-validity: ${JWT_ACCESS_VALIDITY:30m}
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:14d}
