spring:
  application:
    name: moyeota
  config:
    import:
      - classpath:config/profile-images.yaml   # 프로필 이미지 목록
      - optional:classpath:application-local.yaml   # 로컬 시크릿 (git 미추적, 없으면 무시됨)
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
  flyway:
    enabled: false   # 기본(H2 인메모리)에선 끔. Postgres 를 쓰는 dev/prod 프로필에서만 켠다 - 마이그레이션은 Postgres 문법
  data:
    redis:
      host: localhost
      port: 6379
      # 기본 명령 타임아웃은 60초 - Redis 가 멈추면 캐시를 거치는 요청(인증 포함)이 그만큼 매달린다
      timeout: 1s
      connect-timeout: 1s
      lettuce:
        pool:
          enabled: true
          max-active: 16   # 빌리는 시간이 왕복 1번(약 1ms)이라 16개면 초당 수천 번 빌릴 수 있음. 부하테스트 최대 약 350/s
          max-idle: 16     # 다 쓴 연결을 닫지 않고 남겨둘 수. max-active 와 같아야 몰릴 때 만들고 닫기를 반복하지 않음
          max-wait: 1s     # 풀이 다 찼을 때 기다리는 최대 시간. 기본값(-1)은 무한 대기라 반드시 지정
  modulith:
    events:
      republish-outstanding-events-on-restart: false
      completion-mode: DELETE
      staleness:
        published: PT5M
        processing: PT5M
        resubmission: PT30M
        check-intervall: PT1M
  task:
    scheduling:
      pool:
        size: 4

server:
  tomcat:
    max-connections: 20000
    mbeanregistry:
      enabled: true       # Grafana에서 tomcat 연결 수와 바쁜 스레드 수 보기위함

kakao:
  api:
    key: ${KAKAO_API_KEY:}

naver:
  api:
    key-id: ${NAVER_API_KEY_ID:}
    key: ${NAVER_API_KEY:}

chat:
  websocket:
    allowed-origins: http://localhost:*

fcm:
  service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}

portone:
  api:
    secret: ${PORTONE_SECRET:}
  webhook:
    secret: ${PORTONE_WEBHOOK_SECRET:}

jwt:
  secret: ${JWT_SECRET:deXiPUTSbvL2Qg673qn22K4S6fjf6VSBMLfW54E16DrUPty9aapfs/PGqoO+NdP9}   # 로컬 전용 기본값
  access-token-validity: ${JWT_ACCESS_VALIDITY:30m}
  refresh-token-validity: ${JWT_REFRESH_VALIDITY:14d}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: moyeota
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms, 300ms, 500ms, 1s

moyeota:
  taxi:
    enabled: ${TAXI_ENABLED:true}
  crypto:
    field-key: ${FIELD_ENCRYPTION_KEY:XgIsaebhS+OFGOUd4l16AnNPZgXIydBInUv5yyQvmMY=}
    hash-key: ${FIELD_HASH_KEY:local-only-field-hash-key}
  sms:
    provider: ${SMS_PROVIDER:log}   # log | solapi
    review:
      phones: ${SMS_REVIEW_PHONES:}
      code: ${SMS_REVIEW_CODE:}
    solapi:
      api-key: ${SOLAPI_API_KEY:}
      api-secret: ${SOLAPI_API_SECRET:}
      from: ${SOLAPI_FROM:}
  profile-image:
    base-url: ${PROFILE_IMAGE_BASE_URL:https://cdn.moyeota.co.kr/}   # 목록은 profile-images.yaml

osrm:
  base-url: ${OSRM_BASE_URL:http://localhost:5000}
