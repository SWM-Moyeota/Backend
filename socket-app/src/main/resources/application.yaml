spring:
  application:
    name: moyeota-socket
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1s           # API 와 같게 - 기본 60초
      connect-timeout: 1s   # Redis 가 멈췄다 돌아올 때 구독 재연결 시도가 오래 매달리지 않게

server:
  port: 8081   # 로컬에서 API(8080)와 같이 띄우기 위함
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: moyeota-socket
    distribution:
      slo:
        http.client.requests: 10ms, 50ms, 100ms, 300ms, 1s   # /internal 지연 구간 - timeout 1s 까지

chat:
  order:
    max-wait: 200ms        # 빈 순번을 기다리는 최대 시간 - 5배 부하 측정(2026-11-10)에서 역전 메시지가 기다린 최대 163ms
    idle-eviction: 10m     # 메시지가 없는 방의 줄 상태를 지우는 시간
  websocket:
    allowed-origins: http://localhost:*
  api:
    base-url: http://localhost:8080   # 인증·방 멤버 확인을 묻는 API 주소
    timeout: 1s
    internal-token: ${INTERNAL_API_TOKEN:local-only-internal-token}   # API moyeota.internal.token 과 같아야 함
