plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'team.codingforest'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.modulith:spring-modulith-bom:2.0.1'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.redisson:redisson:4.6.1' // 분산 락 전용. 기존 Spring Data Redis 구성은 유지
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.modulith:spring-modulith-starter-jpa'       // 아웃박스 패턴 적용하기 위한 이벤트 발생 기록을 JPA로 저장
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.0'	// UUID v7
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'   // Boot 4 → springdoc 3.x
	implementation 'org.springframework.boot:spring-boot-starter-flyway'          // Boot 4.1 은 starter 없이는 auto-config 가 안 붙음
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	implementation 'com.google.firebase:firebase-admin:9.10.0'		// fcm 의존성 추가
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'matching-lock-topology'   // 실제 Sentinel/Cluster 컨테이너가 필요한 실험은 기본 CI 에서 뺀다
	}
}

// 매칭 잠금 토폴로지 실험. infra/matching-lock/compose.*.yaml 을 띄운 뒤 -Dmatching.lock.topology=sentinel 로 고른다.
tasks.register('matchingLockTopologyTest', Test) {
	description = '실제 Redis Sentinel/Cluster 위에서 매칭 잠금의 연결·직렬화·장애 전환을 검증'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'matching-lock-topology' }
	systemProperty 'matching.lock.topology', System.getProperty('matching.lock.topology', 'sentinel')
	systemProperty 'matching.lock.failover', System.getProperty('matching.lock.failover', 'false')
	systemProperty 'matching.lock.failover.watchdogMs', System.getProperty('matching.lock.failover.watchdogMs', '2000')
	testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
	outputs.upToDateWhen { false }
}
